<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザープロフィール</title>
</head>

<body>
    <h1>ユーザープロフィール</h1>
    
    <p th:if="${message}" th:text="${message}"></p>
    <br>
<!--<form method="get" th:action="@{/profile/{id}/edit(id=${form.id})}" th:object="${form}">-->
    <form method="get" th:action="@{/profile/edit(id=${form.id})}" th:object="${form}"> 
        <input type="hidden" th:field="*{id}">

        <p>名前: <span th:text="*{name}"></span></p>
        <p>年齢: <span th:text="*{age}"></span></p>
        <p>自己紹介: <span th:text="*{bio}"></span></p>

        <button type="submit">編集</button>
    </form>
  
</body>
</html>
