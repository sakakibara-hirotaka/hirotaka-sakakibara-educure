<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>会議室予約フォーム</title>
        <meta charset="UTF-8">
    </head>

    <body>
        <h1>会議室予約フォーム</h1>
        <form th:action="@{/check}" method="post" th:object="${form}">
            <div>
                <label>会議室名:</label>
                <select th:field="*{roomName}">
                    <option value="">選択してください</option>
                    <option value="小会議室">小会議室</option>
                    <option value="大会議室">大会議室</option>
                </select>

                <p><span th:if="${#fields.hasErrors('roomName')}" th:errors="*{roomName}"></span><p>
            </div>
            
            <div>
                <label>利用開始日時:</label>
                <input type="datetime-local" th:field="*{startDateTime}">
               <p> <span th:if="${#fields.hasErrors('startDateTime')}" th:errors="*{startDateTime}"></span></p>
            </div>

            <div>
                <label>利用終了日時:</label>
                <input type="datetime-local" th:field="*{endDateTime}">
                <p> <span th:if="${#fields.hasErrors('endDateTime')}" th:errors="*{endDateTime}"></span></p>
            </div>

            <div>
                <label>利用人数:</label>
                <input type="text" th:field="*{peopleCount}">
                <p><span th:if="${#fields.hasErrors('peopleCount')}" th:errors="*{peopleCount}"></span></p>
            </div>

            <button type="submit">確認</button>
        </form>

    </body>

</html>
