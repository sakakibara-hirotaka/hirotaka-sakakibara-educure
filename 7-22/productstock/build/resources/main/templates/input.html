<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>在庫入力フォーム</title>
</head>
<body>
    <h1>在庫数入力フォーム</h1>
    
    <form action="/stockProduct" method="post" th:object="${product}">
        <div>
        <label>在庫数:</label>
        <input type="text" th:field="*{stock}">
        </div>
        <p th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>
        <button type="submit">確認</button>
    </form>
</body>
</html>
