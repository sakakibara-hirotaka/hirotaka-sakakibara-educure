<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>イベント申込期間</title>
        <meta charset="UTF-8">
    </head>

    <body>
        <h1>イベント申し込み期間</h1>

        <form action="/checkEvent" method="post" th:object="${event}">
            <div>
                <label>開始日:</label>
                <input type="date" th:field="*{startDateTime}">
                <span th:if="${#fields.hasErrors('startDateTime')}" th:errors="*{startDateTime}"></span>
                
            </div>

            <div>
                <label>終了日:</label>
                <input type="date" th:field="*{endDateTime}">
                <span th:if="${#fields.hasErrors('endDateTime')}" th:errors="*{endDateTime}"></span>
            </div>

            <button type="submit">確認</button>
        </form>
    </body>
</html>
